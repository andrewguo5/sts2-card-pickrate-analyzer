<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>STS2 Card Pick Rate Analyzer</title>
    <link rel="stylesheet" href="styles.css">
    <script src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
    <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.0/dist/chart.umd.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/chartjs-plugin-annotation@3.0.1/dist/chartjs-plugin-annotation.min.js"></script>

    <!-- Component imports -->
    <script src="glossary.js"></script>
    <script src="components/config.js"></script>
    <script src="components/InfoIcon.js"></script>
    <script src="components/DeltaBadge.js"></script>
    <script src="components/HelpPanel.js"></script>
    <script src="components/ChartComponent.js"></script>
    <script src="components/SkipRateChart.js"></script>
    <script src="components/WinRateChart.js"></script>
    <script src="components/FilterBar.js"></script>
    <script src="components/MetadataBar.js"></script>
    <script src="components/CardList.js"></script>
    <script src="components/PickRateTab.js"></script>
    <script src="components/SkipRateTab.js"></script>
    <script src="components/WinRateTab.js"></script>
    <script src="components/CardScatterPlot.js"></script>
    <script src="components/VisualizationTab.js"></script>
    <script src="components/CardDetail.js"></script>
    <script src="components/LandingPage.js"></script>
    <script src="components/UploaderGuide.js"></script>
</head>
<body>
    <div id="root"></div>

    <script>
        const { useState, useEffect, useMemo } = React;
        const { API_BASE_URL, CHARACTERS, MODES, ASCENSIONS } = window.AppConfig;

        // Overall skip rate for a card, summed across floors. Shared by the sort
        // comparator and the sidebar badge resolver so they can't diverge.
        function overallSkipRate(card) {
            const offered = Object.values(card.skip_data || {}).reduce((sum, d) => sum + (d.offered || 0), 0);
            const skipped = Object.values(card.skip_data || {}).reduce((sum, d) => sum + (d.skipped || 0), 0);
            return offered > 0 ? skipped / offered : 0;
        }

        // Given a flattened card and the active detail tab, return the stat the
        // sidebar badge (and its trend arrow) should display for that tab.
        function resolveTabStat(card, activeTab) {
            if (activeTab === 'winrate') {
                return {
                    rate: card.winrates_by_act?.overall || 0,
                    deltaPp: card.winrate_delta_pp,
                    sufficient: card.winrate_trend_ok
                };
            }
            if (activeTab === 'skiprate') {
                return {
                    rate: overallSkipRate(card),
                    deltaPp: card.skiprate_delta_pp,
                    sufficient: card.skiprate_trend_ok
                };
            }
            return {
                rate: card.overall_pickrate || 0,
                deltaPp: card.pickrate_delta_pp,
                sufficient: card.pickrate_trend_ok
            };
        }
        window.resolveTabStat = resolveTabStat;

        // Rate-based sort options that should also switch the active detail tab.
        const SORT_TO_TAB = { pickrate: 'pickrate', winrate: 'winrate', skiprate: 'skiprate' };

        // ---------------------------------------------------------------------
        // Hash routing
        //
        // The app is served as static files with no build step and no history
        // API, so routes live in location.hash. The hash is the single source of
        // truth: navigate() only writes the hash, and a hashchange listener
        // drives React state from it. Nothing writes `route` directly, so the
        // URL and the rendered view cannot disagree.
        //
        // Grammar:
        //   #/                    -> landing
        //   #/analyzer            -> analyzer, default character
        //   #/analyzer/ironclad   -> analyzer, character preselected
        //   #/upload              -> uploader instructions
        // Anything unrecognized falls back to the landing page.
        // ---------------------------------------------------------------------
        const ROUTES = { LANDING: 'landing', ANALYZER: 'analyzer', UPLOAD: 'upload' };
        const DEFAULT_CHARACTER = 'regent';

        function parseHash(hash) {
            const [routeSegment, characterSegment] = hash.replace(/^#\/?/, '').split('/');

            if (routeSegment === ROUTES.UPLOAD) {
                return { route: ROUTES.UPLOAD, character: DEFAULT_CHARACTER };
            }
            if (routeSegment === ROUTES.ANALYZER) {
                const isKnownCharacter = CHARACTERS.some(c => c.id === characterSegment);
                return {
                    route: ROUTES.ANALYZER,
                    character: isKnownCharacter ? characterSegment : DEFAULT_CHARACTER
                };
            }
            return { route: ROUTES.LANDING, character: DEFAULT_CHARACTER };
        }

        // Writing the hash is the only way to navigate; the listener does the rest.
        function navigate(route, characterId) {
            const suffix = route === ROUTES.ANALYZER && characterId ? `/${characterId}` : '';
            window.location.hash = `#/${route === ROUTES.LANDING ? '' : route}${suffix}`;
        }

        function useHashRoute() {
            const [location, setLocation] = useState(() => parseHash(window.location.hash));

            useEffect(() => {
                const syncFromHash = () => setLocation(parseHash(window.location.hash));
                window.addEventListener('hashchange', syncFromHash);
                return () => window.removeEventListener('hashchange', syncFromHash);
            }, []);

            return location;
        }

        function App() {
            const { route, character } = useHashRoute();

            if (route === ROUTES.LANDING) {
                return React.createElement(window.LandingPage, { onNavigate: navigate });
            }
            if (route === ROUTES.UPLOAD) {
                return React.createElement(window.UploaderGuide, { onNavigate: navigate });
            }
            // Keyed on character so a landing-page pick remounts the view rather
            // than leaving the previous character's fetched data on screen.
            return React.createElement(window.AnalyzerView, {
                key: character,
                initialCharacter: character,
                onNavigate: navigate
            });
        }

        // Reload persistence
        //
        // The hash carries route + character, but the in-analyzer selections
        // (mode, ascension, user, active tab, view mode) live in component state
        // and would reset on reload. We mirror just those to sessionStorage so a
        // reload lands you where you were — without contaminating the URL and
        // without stickiness across days: a fresh tab starts clean.
        const ANALYZER_STATE_KEY = 'mbgg:analyzer-view';

        function readPersistedAnalyzerState() {
            try {
                return JSON.parse(sessionStorage.getItem(ANALYZER_STATE_KEY)) || {};
            } catch {
                return {}; // corrupt/blocked storage falls back to defaults
            }
        }

        // A useState whose value is mirrored into the analyzer's sessionStorage
        // blob under `key`. Reads the stored value on first mount, writes on every
        // change. Keeping one blob (not one key per field) keeps storage tidy.
        function usePersistedAnalyzerState(key, defaultValue) {
            const [value, setValue] = useState(() => {
                const stored = readPersistedAnalyzerState();
                return key in stored ? stored[key] : defaultValue;
            });

            useEffect(() => {
                const stored = readPersistedAnalyzerState();
                stored[key] = value;
                try {
                    sessionStorage.setItem(ANALYZER_STATE_KEY, JSON.stringify(stored));
                } catch {
                    /* storage full/blocked — persistence is best-effort */
                }
            }, [key, value]);

            return [value, setValue];
        }

        // The analyzer. It mounts only on #/analyzer, so its data fetches never
        // fire on the landing or uploader pages.
        function AnalyzerView({ initialCharacter, onNavigate }) {
            const [data, setData] = useState(null);
            const [selectedCard, setSelectedCard] = useState(null);
            const [searchTerm, setSearchTerm] = useState('');
            const [loading, setLoading] = useState(true);
            const [error, setError] = useState(null);
            const [selectedCharacter, setSelectedCharacter] = useState(initialCharacter);
            // Persisted across reload (sessionStorage) so the view isn't reset.
            const [selectedMode, setSelectedMode] = usePersistedAnalyzerState('mode', 'singleplayer');
            const [selectedAscension, setSelectedAscension] = usePersistedAnalyzerState('ascension', 'a10');
            const [selectedUser, setSelectedUser] = usePersistedAnalyzerState('user', null); // null = global stats
            const [usersList, setUsersList] = useState([]);
            const [usernameCache, setUsernameCache] = useState({});
            const [filteredRunCounts, setFilteredRunCounts] = useState({}); // steam_id -> filtered count
            const [sortBy, setSortBy] = useState('offered');
            const [filterType, setFilterType] = useState('all');
            const [filterRarity, setFilterRarity] = useState('all');
            const [activeTab, setActiveTab] = usePersistedAnalyzerState('tab', 'pickrate');
            const [isGlossaryOpen, setIsGlossaryOpen] = useState(false);
            const [coordinateData, setCoordinateData] = useState(null);
            const [loadingCoordinates, setLoadingCoordinates] = useState(false);
            const [viewMode, setViewMode] = usePersistedAnalyzerState('viewMode', 'table'); // 'table' or 'visualization'

            // Changing the sort to a rate-based option also switches the detail tab
            // (and thus the sidebar badges) so sort, tab, and badges stay coherent.
            // Offered/Alphabetical sorts leave the tab untouched.
            const handleSortChange = (value) => {
                setSortBy(value);
                if (SORT_TO_TAB[value]) setActiveTab(SORT_TO_TAB[value]);
            };

            // Apply character theme colors
            useEffect(() => {
                const character = CHARACTERS.find(c => c.id === selectedCharacter);
                if (character && character.colors) {
                    const root = document.documentElement;
                    root.style.setProperty('--char-primary', character.colors.primary);
                    root.style.setProperty('--char-secondary', character.colors.secondary);
                    root.style.setProperty('--char-accent', character.colors.accent);
                    root.style.setProperty('--char-gradient', character.colors.gradient);
                }
            }, [selectedCharacter]);

            // Fetch users list on mount
            useEffect(() => {
                fetch(`${API_BASE_URL}/api/analytics/users`)
                    .then(response => response.json())
                    .then(users => {
                        setUsersList(users);
                        // Fetch usernames for all users
                        const steamIds = users.map(u => u.steam_id).join(',');
                        if (steamIds) {
                            fetch(`${API_BASE_URL}/api/steam/usernames?steam_ids=${steamIds}`)
                                .then(response => response.json())
                                .then(names => setUsernameCache(names))
                                .catch(err => console.error('Error fetching usernames:', err));
                        }
                    })
                    .catch(err => console.error('Error fetching users:', err));
            }, []);

            // Fetch filtered run counts when character/mode/ascension changes
            useEffect(() => {
                const params = new URLSearchParams({
                    character: selectedCharacter,
                    mode: selectedMode,
                    ascension: selectedAscension
                });

                fetch(`${API_BASE_URL}/api/analytics/users/filtered-counts?${params}`)
                    .then(response => response.json())
                    .then(counts => setFilteredRunCounts(counts))
                    .catch(err => console.error('Error fetching filtered run counts:', err));
            }, [selectedCharacter, selectedMode, selectedAscension]);

            // Fetch coordinate data when filters change
            useEffect(() => {
                setLoadingCoordinates(true);

                const params = new URLSearchParams({
                    character: selectedCharacter,
                    mode: selectedMode,
                    ascension: selectedAscension
                });

                if (selectedUser) {
                    params.append('steam_id', selectedUser);
                }

                fetch(`${API_BASE_URL}/api/analytics/card-coordinates?${params}`)
                    .then(response => response.json())
                    .then(data => {
                        setCoordinateData(data);
                        setLoadingCoordinates(false);
                    })
                    .catch(err => {
                        console.error('Error fetching coordinate data:', err);
                        setCoordinateData(null);
                        setLoadingCoordinates(false);
                    });
            }, [selectedCharacter, selectedMode, selectedAscension, selectedUser]);

            // Track previous filter values to detect what changed
            const prevFiltersRef = React.useRef({
                character: selectedCharacter,
                mode: selectedMode,
                ascension: selectedAscension,
                user: selectedUser
            });

            useEffect(() => {
                setLoading(true);
                setError(null);

                // Only clear selected card if character/mode/ascension changed
                // Preserve it if only user changed (allows comparing same card across users)
                const prevFilters = prevFiltersRef.current;
                const onlyUserChanged = (
                    prevFilters.character === selectedCharacter &&
                    prevFilters.mode === selectedMode &&
                    prevFilters.ascension === selectedAscension &&
                    prevFilters.user !== selectedUser
                );

                if (!onlyUserChanged) {
                    setSelectedCard(null);
                    setData(null); // Drop stale data so auto-select can't pick a card from the previous filter bucket
                    setActiveTab('pickrate'); // Reset to default tab when changing character/mode/ascension
                }
                // If only user changed, preserve both selected card AND active tab

                // Update ref for next time
                prevFiltersRef.current = {
                    character: selectedCharacter,
                    mode: selectedMode,
                    ascension: selectedAscension,
                    user: selectedUser
                };

                // Build API request params
                const params = new URLSearchParams({
                    character: selectedCharacter,
                    mode: selectedMode,
                    ascension: selectedAscension
                });

                // Choose endpoint based on whether a user is selected
                let endpoint;
                if (selectedUser) {
                    params.append('steam_id', selectedUser);
                    endpoint = `${API_BASE_URL}/api/analytics/user-stats?${params}`;
                } else {
                    endpoint = `${API_BASE_URL}/api/analytics/global-stats?${params}`;
                }

                fetch(endpoint)
                    .then(response => {
                        if (!response.ok) {
                            throw new Error(`API error: ${response.status}`);
                        }
                        return response.json();
                    })
                    .then(jsonData => {
                        setData(jsonData);
                        setLoading(false);

                        // If a card was selected and only user changed, update the selected card with new data
                        if (onlyUserChanged && selectedCard) {
                            const newCardData = jsonData.cards[selectedCard.id];
                            if (newCardData) {
                                setSelectedCard({
                                    id: selectedCard.id,
                                    name: newCardData.summary.name || selectedCard.id.replace('CARD.', ''),
                                    ...newCardData.summary,
                                    rawData: newCardData.raw_data,
                                    rawPickrates: newCardData.raw_pickrates,
                                    smoothedPickrates: newCardData.smoothed_pickrates,
                                    rawSkiprates: newCardData.raw_skiprates,
                                    smoothedSkiprates: newCardData.smoothed_skiprates,
                                    skip_data: newCardData.skip_data,
                                    winrates_by_act: newCardData.winrates_by_act,
                                    winrate_data: newCardData.winrate_data
                                });
                            } else {
                                // Card doesn't exist in new data (e.g., user hasn't seen it), clear selection
                                setSelectedCard(null);
                            }
                        }
                    })
                    .catch(error => {
                        console.error('Error loading data:', error);
                        setError(error.message);
                        setData(null);
                        setLoading(false);
                    });
            }, [selectedCharacter, selectedMode, selectedAscension, selectedUser]);

            const sortedCards = useMemo(() => {
                if (!data) return [];

                let cards = Object.entries(data.cards)
                    .map(([cardId, cardData]) => ({
                        id: cardId,
                        name: cardData.summary.name || cardId.replace('CARD.', ''),
                        ...cardData.summary,
                        rawData: cardData.raw_data,
                        rawPickrates: cardData.raw_pickrates,
                        smoothedPickrates: cardData.smoothed_pickrates,
                        rawSkiprates: cardData.raw_skiprates,
                        smoothedSkiprates: cardData.smoothed_skiprates,
                        skip_data: cardData.skip_data,
                        winrates_by_act: cardData.winrates_by_act,
                        winrate_data: cardData.winrate_data
                    }));

                // Apply filters
                cards = cards.filter(card => {
                    // Search filter
                    if (searchTerm && !card.name.toLowerCase().includes(searchTerm.toLowerCase())) {
                        return false;
                    }

                    // Type filter
                    if (filterType !== 'all' && card.type !== filterType) {
                        return false;
                    }

                    // Rarity filter
                    if (filterRarity !== 'all' && card.rarity !== filterRarity) {
                        return false;
                    }

                    return true;
                });

                // Apply sorting
                cards.sort((a, b) => {
                    if (sortBy === 'offered') {
                        return b.total_offered - a.total_offered;
                    } else if (sortBy === 'pickrate') {
                        return b.overall_pickrate - a.overall_pickrate;
                    } else if (sortBy === 'winrate') {
                        // Sort by overall win rate (highest first)
                        const aWinRate = a.winrates_by_act?.overall || 0;
                        const bWinRate = b.winrates_by_act?.overall || 0;
                        return bWinRate - aWinRate;
                    } else if (sortBy === 'skiprate') {
                        // Sort by skip rate (least skipped first = lowest skip rate first).
                        // Cards with no offers sort last (treated as fully skipped).
                        const aSkipRate = a.skip_data && Object.keys(a.skip_data).length ? overallSkipRate(a) : 1;
                        const bSkipRate = b.skip_data && Object.keys(b.skip_data).length ? overallSkipRate(b) : 1;
                        return aSkipRate - bSkipRate; // Ascending order (least skipped first)
                    } else if (sortBy === 'alphabetical') {
                        return a.name.localeCompare(b.name);
                    }
                    return 0;
                });

                return cards;
            }, [data, searchTerm, sortBy, filterType, filterRarity]);

            // Default selection on first load: pick the top card by overall pick rate
            // so the detail panel isn't empty when the page opens. Only applies when
            // nothing is selected yet (e.g. fresh load or after filters cleared it),
            // so it never overrides a card the user clicked.
            useEffect(() => {
                if (!data || selectedCard || sortedCards.length === 0) return;

                const topByPickRate = sortedCards.reduce((best, card) =>
                    (card.overall_pickrate || 0) > (best.overall_pickrate || 0) ? card : best
                );
                setSelectedCard(topByPickRate);
            }, [data, selectedCard, sortedCards]);

            const chartData = useMemo(() => {
                if (!selectedCard) return [];

                const floors = Object.keys(selectedCard.smoothedPickrates).map(Number).sort((a, b) => a - b);

                return floors.map(floor => ({
                    floor,
                    raw: selectedCard.rawPickrates[floor] * 100,
                    smoothed: selectedCard.smoothedPickrates[floor] * 100,
                    offered: selectedCard.rawData[floor].offered,
                    picked: selectedCard.rawData[floor].picked
                }));
            }, [selectedCard]);

            const skipRateData = useMemo(() => {
                if (!selectedCard || !selectedCard.smoothedSkiprates) return [];

                const floors = Object.keys(selectedCard.smoothedSkiprates).map(Number).sort((a, b) => a - b);

                return floors.map(floor => ({
                    floor,
                    raw: (selectedCard.rawSkiprates[floor] || 0) * 100,
                    smoothed: (selectedCard.smoothedSkiprates[floor] || 0) * 100,
                    baseline: data.baseline_skip_data?.smoothed?.[floor] ? data.baseline_skip_data.smoothed[floor] * 100 : undefined,
                    offered: selectedCard.skip_data?.[floor]?.offered || 0,
                    skipped: selectedCard.skip_data?.[floor]?.skipped || 0
                }));
            }, [selectedCard, data]);

            const winRateData = useMemo(() => {
                if (!selectedCard || !selectedCard.winrates_by_act) return [];

                // Filter out "overall" key and only include numeric act keys
                const acts = Object.keys(selectedCard.winrates_by_act)
                    .filter(key => key !== 'overall')
                    .map(Number)
                    .sort((a, b) => a - b);

                return acts.map(act => ({
                    act,
                    winrate: (selectedCard.winrates_by_act[act] || 0) * 100,
                    picked: selectedCard.winrate_data?.[act]?.picked || 0,
                    won: selectedCard.winrate_data?.[act]?.won || 0
                }));
            }, [selectedCard]);

            return React.createElement('div', { className: 'container' },
                // Scrollable content wrapper
                React.createElement('div', { className: 'scrollable-content' },
                    // Header
                    React.createElement('div', { className: 'header' },
                        React.createElement('button', {
                            className: 'header-home-link',
                            onClick: () => onNavigate(ROUTES.LANDING),
                            title: 'Back to all characters'
                        }, '← All characters'),
                        React.createElement('h1', null, 'STS2 Card Pick Rate Analyzer'),
                        React.createElement('div', { className: 'subtitle' }, 'Card pick rates by floor'),
                        React.createElement('button', {
                            className: 'header-upload-link',
                            onClick: () => onNavigate(ROUTES.UPLOAD),
                            title: 'Upload your runs'
                        }, 'Upload runs')
                    ),

                    // FilterBar (sticky within scrollable content)
                    React.createElement(window.FilterBar, {
                        selectedCharacter,
                        // Route through the hash so the URL and the selected
                        // character can't drift apart: navigate() rewrites the
                        // hash, the hashchange listener re-parses it, and App
                        // remounts this view keyed on the new character. Setting
                        // state directly would leave the URL pointing at the
                        // character the visitor originally deep-linked to.
                        onCharacterChange: (characterId) => onNavigate(ROUTES.ANALYZER, characterId),
                        selectedMode,
                        setSelectedMode,
                        selectedAscension,
                        setSelectedAscension,
                        selectedUser,
                        setSelectedUser,
                        usersList,
                        usernameCache,
                        filteredRunCounts,
                        onOpenGlossary: () => setIsGlossaryOpen(true),
                        viewMode,
                        setViewMode
                    }),

                    // MetadataBar
                    data && React.createElement(window.MetadataBar, {
                        metadata: data.metadata,
                        usernameCache: usernameCache,
                        baselineWinrate: data.baseline_winrate
                    }),

                    // Content area
                viewMode === 'table' ? React.createElement('div', { className: 'content' },
                    // CardList sidebar
                    loading || error || !data
                        ? React.createElement('div', { className: 'sidebar' },
                            React.createElement('div', { className: 'loading', style: { padding: '20px', textAlign: 'center' } },
                                loading ? 'Loading...' : error ? `Error: ${error}` : 'No data available'
                            )
                        )
                        : React.createElement(window.CardList, {
                            cards: sortedCards,
                            selectedCard,
                            onSelectCard: setSelectedCard,
                            searchTerm,
                            onSearchChange: setSearchTerm,
                            sortBy,
                            onSortChange: handleSortChange,
                            filterType,
                            onFilterTypeChange: setFilterType,
                            filterRarity,
                            onFilterRarityChange: setFilterRarity,
                            activeTab, // sidebar badges follow the selected detail tab
                            showTrend: !!selectedUser // trend arrows only exist on the personal stats path
                        }),

                    // CardDetail main panel
                    React.createElement('div', { className: 'main-panel' },
                        loading || error || !data
                            ? React.createElement('div', { className: 'loading', style: { padding: '40px', textAlign: 'center' } },
                                loading ? 'Loading...' : error ? `Error loading data: ${error}` : 'No data available'
                            )
                            : React.createElement(window.CardDetail, {
                                selectedCard,
                                chartData,
                                skipRateData,
                                winRateData,
                                baselineSkipData: data?.baseline_skip_data,
                                baselineWinrate: data?.baseline_winrate,
                                activeTab,
                                setActiveTab,
                                showTrend: !!selectedUser // trend deltas only exist on the personal stats path
                            })
                    )
                ) // End of table content
                : React.createElement('div', { style: { display: 'flex', flexDirection: 'column', flex: 1, overflow: 'hidden' } },
                    // Visualization view with title spanning full width
                    loadingCoordinates
                        ? React.createElement('div', { className: 'loading', style: { padding: '40px', textAlign: 'center' } },
                            'Loading visualization...'
                        )
                        : React.createElement(window.VisualizationTab, {
                            coordinateData,
                            onCardClick: (cardId) => {
                                // Switch to table view and select the card
                                setViewMode('table');
                                if (data && data.cards && data.cards[cardId]) {
                                    const cardData = data.cards[cardId];
                                    setSelectedCard({
                                        id: cardId,
                                        name: cardData.summary.name || cardId.replace('CARD.', ''),
                                        ...cardData.summary,
                                        rawData: cardData.raw_data,
                                        rawPickrates: cardData.raw_pickrates,
                                        smoothedPickrates: cardData.smoothed_pickrates,
                                        rawSkiprates: cardData.raw_skiprates,
                                        smoothedSkiprates: cardData.smoothed_skiprates,
                                        skip_data: cardData.skip_data,
                                        winrates_by_act: cardData.winrates_by_act,
                                        winrate_data: cardData.winrate_data
                                    });
                                }
                            },
                            selectedCardId: selectedCard?.id,
                            character: selectedCharacter,
                            mode: selectedMode,
                            ascension: selectedAscension,
                            selectedUser
                        })
                ) // End of visualization content
                ), // End of scrollable-content

                // Glossary side panel (rendered outside scrollable content)
                React.createElement(window.HelpPanel, {
                    isOpen: isGlossaryOpen,
                    onClose: () => setIsGlossaryOpen(false)
                })
            );
        }

        ReactDOM.render(React.createElement(App), document.getElementById('root'));
    </script>
</body>
</html>
